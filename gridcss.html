<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      padding: 40px;
      background: #fafbfc;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e8ecf1;
    }

    .card h3 {
      font-family: 'Space Grotesk', sans-serif;
      margin-bottom: 12px;
      color: #0f172a;
    }

    .card p {
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <h3>HTML</h3>
      <p>Estrutura semântica e acessível.</p>
    </div>
    <div class="card">
      <h3>CSS</h3>
      <p>Estilos responsivos e modernos.</p>
    </div>
    <div class="card">
      <h3>JavaScript</h3>
      <p>Interatividade e lógica.</p>
    </div>
    <div class="card">
      <h3>React</h3>
      <p>Interfaces componentizadas.</p>
    </div>
  </div>
</body>
</html>
